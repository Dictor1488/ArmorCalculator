name: Збірка мода

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версія збірки"
        required: true
        default: "1.8.5"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Завантажити репозиторій
        uses: actions/checkout@v4

      - name: Встановити Python 2.7
        shell: pwsh
        run: |
          choco install python2 -y --no-progress
          if (-not (Test-Path "C:\Python27\python.exe")) {
            throw "Python 2.7 не знайдено у C:\Python27\python.exe"
          }
          & "C:\Python27\python.exe" --version

      - name: Встановити Python 3 для пакування
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Визначити версію
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}"
          }
          $version = $version.TrimStart('v')
          $modName = "unicorn.ares-armor-calculator-$version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MOD_NAME=$modName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Підготувати структуру мода
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item build, dist -Recurse -Force -ErrorAction SilentlyContinue

          $mods = "build\res\scripts\client\gui\mods"
          $gf = "build\res\gui\gameface\mods\unicorn_ares\ArmorCalculator"
          $resmap = "build\res\mods\configs\res_map"
          New-Item -ItemType Directory -Force -Path $mods, $gf, $resmap, "dist" | Out-Null

          $modules = @(
            "mod_unicorn_ares_armor.py",
            "mod_unicorn_ares_settings_v2.py",
            "unicorn_ares_config.py",
            "unicorn_ares_constants.py",
            "unicorn_ares_gui.py"
          )
          foreach ($module in $modules) {
            Copy-Item (Join-Path "src" $module) $mods -Force
          }

          Copy-Item "gameface\ArmorCalculatorBattle.html" $gf -Force
          Copy-Item "gameface\ArmorCalculator.css" $gf -Force
          Copy-Item "gameface\ArmorCalculator.js" $gf -Force
          Copy-Item "gameface\armor_calculator_res_map.json" (Join-Path $resmap "armor_calculator_gameface.json") -Force

          @"
          <root>
            <id>unicorn.ares.armor_calculator</id>
            <version>${{ env.VERSION }}</version>
            <name>unicorn.ares Armor Calculator</name>
            <description>GameFace armor penetration calculator for World of Tanks. Requires OpenWG.Gameface.</description>
          </root>
          "@ | Set-Content -Path "build\meta.xml" -Encoding UTF8

      - name: Компілювати Python 2.7
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $mods = "build\res\scripts\client\gui\mods"
          & "C:\Python27\python.exe" -m compileall -f $mods
          if ($LASTEXITCODE -ne 0) { throw "Компіляція Python 2.7 завершилася з помилкою" }
          $sourceFiles = Get-ChildItem $mods -Filter "*.py" -Recurse
          foreach ($source in $sourceFiles) {
            if (-not (Test-Path "$($source.FullName)c")) {
              throw "Не створено .pyc: $($source.FullName)"
            }
          }
          Remove-Item "$mods\*.py" -Force -Recurse

      - name: Перевірити GameFace ресурси
        shell: pwsh
        run: |
          $required = @(
            "build\res\gui\gameface\mods\unicorn_ares\ArmorCalculator\ArmorCalculatorBattle.html",
            "build\res\gui\gameface\mods\unicorn_ares\ArmorCalculator\ArmorCalculator.css",
            "build\res\gui\gameface\mods\unicorn_ares\ArmorCalculator\ArmorCalculator.js",
            "build\res\mods\configs\res_map\armor_calculator_gameface.json"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Відсутній GameFace ресурс: $file" }
          }

      - name: Створити .wotmod без стиснення
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import os
          import zipfile
          build_dir = r"build"
          output = os.path.join("dist", os.environ["MOD_NAME"] + ".wotmod")
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for root, dirs, files in os.walk(build_dir):
                  dirs.sort()
                  files.sort()
                  for filename in files:
                      full_path = os.path.join(root, filename)
                      archive_name = os.path.relpath(full_path, build_dir).replace(os.sep, "/")
                      archive.write(full_path, archive_name, compress_type=zipfile.ZIP_STORED)
          with zipfile.ZipFile(output, "r") as archive:
              names = set(item.filename for item in archive.infolist())
              required = {
                  "res/gui/gameface/mods/unicorn_ares/ArmorCalculator/ArmorCalculatorBattle.html",
                  "res/gui/gameface/mods/unicorn_ares/ArmorCalculator/ArmorCalculator.css",
                  "res/gui/gameface/mods/unicorn_ares/ArmorCalculator/ArmorCalculator.js",
                  "res/mods/configs/res_map/armor_calculator_gameface.json",
              }
              missing = sorted(required - names)
              if missing:
                  raise RuntimeError("Missing GameFace files: %r" % missing)
              if any(item.compress_type != zipfile.ZIP_STORED for item in archive.infolist()):
                  raise RuntimeError("У .wotmod є стиснуті записи")
              if any(name.lower().endswith(".py") for name in names):
                  raise RuntimeError("У .wotmod залишилися .py")
          print("Created", output)
          '@ | python -

      - name: Створити ZIP для завантаження
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\${{ env.MOD_NAME }}.wotmod" -DestinationPath "dist\${{ env.MOD_NAME }}.zip" -Force

      - name: Завантажити артефакт Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_NAME }}
          path: |
            dist/*.wotmod
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
